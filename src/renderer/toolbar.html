<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <title>ParrotLingo Toolbar</title>
    <style>
      /* 悬浮工具栏内联透明样式
       * 必须在 <head> 内写死，确保在任何 CSS 加载前背景已透明
       * 不能依赖 tailwind / main.css，因为那些文件设置了 body { background: var(--bg-app) } */
      html {
        margin: 0 !important;
        background-color: transparent !important;
        background-image: none !important;
      }

      body {
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        width: 100vw !important;
        height: 100vh !important;
        background-color: transparent !important;
        background-image: none !important;
        -webkit-user-select: none;
        user-select: none;
      }

      #root {
        margin: 0 !important;
        padding: 0 !important;
        width: max-content !important;
        height: fit-content !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/toolbar.tsx"></script>
  </body>
</html>
